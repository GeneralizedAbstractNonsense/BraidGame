<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Braid</title>
  
  <script>
    MathJax = {
      tex: { inlineMath: [['$', '$']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: rgb(239, 239, 239);
      color: #1e293b;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }

    /* Top Navigation Header */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: #ffffff;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 3px 3px 0px #1e293b;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      color: #1e293b;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Hand-drawn / Pencil Button */
    .btn-pencil {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
      background-color: #ffffff;
      border: 2px solid #1e293b;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 2px 2px 0px #1e293b;
      transition: all 0.15s ease-in-out;
      user-select: none;
    }

    .btn-pencil:hover {
      background-color: #f8fafc;
      transform: scale(1.03) rotate(-1deg);
      box-shadow: 3px 4px 0px #1e293b;
      color: #0284c7;
      border-color: #0284c7;
    }

    .btn-pencil:hover svg {
      stroke: #0284c7;
    }

    .btn-pencil:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px #1e293b;
    }

    .btn-icon {
      width: 15px;
      height: 15px;
      stroke: #1e293b;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* Modals & Overlays */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #ffffff;
      padding: 30px 36px;
      border: 2.5px solid #1e293b;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      box-shadow: 6px 8px 0px #1e293b;
      max-width: 480px;
      width: 100%;
      text-align: center;
      color: #1e293b;
    }

    .modal-card h2 {
      font-size: 22px;
      margin-bottom: 16px;
      color: #0f172a;
    }

    .modal-card p {
      font-size: 14px;
      line-height: 1.6;
      color: #475569;
      margin-bottom: 20px;
      text-align: left;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Main Grid Layout */
    .game-board {
      display: grid;
      grid-template-columns: 340px 1fr 360px;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      flex: 1;
      height: calc(100vh - 75px);
    }

    .left-panel {
      grid-column: 1;
      grid-row: 1 / span 2;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .player-slot {
      flex: 1;
      background: #ffffff;
      border: 2px solid #1e293b;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      box-shadow: 3px 3px 0px #1e293b;
      transition: border-color 0.3s, background-color 0.3s, box-shadow 0.3s;
    }

    .player-slot.active-turn {
      border-color: #16a34a;
      background: #f0fdf4;
      box-shadow: 3px 3px 0px #16a34a;
    }

    .player-slot.disabled {
      opacity: 0.4;
      pointer-events: none;
      filter: grayscale(80%);
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .player-header h3 {
      font-size: 15px;
      color: #0f172a;
      font-weight: 700;
    }

    .hand-container {
      flex: 1;
      display: flex;
      gap: 8px;
      align-items: center;
      overflow-x: auto;
      padding: 8px;
      background: #f8fafc;
      border: 1.5px dashed #cbd5e1;
      border-radius: 8px;
      min-height: 110px;
    }

    .card {
      width: 75px;
      height: 105px;
      background: #ffffff;
      color: #1e293b;
      border: 2px solid #1e293b;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      box-shadow: 2px 3px 0px #1e293b;
      transition: transform 0.2s, box-shadow 0.2s;
      flex-shrink: 0;
      padding: 4px;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 4px 6px 0px #1e293b;
    }

    .card.jolly-card {
      background: linear-gradient(135deg, #fef08a, #fde047);
      border-color: #ca8a04;
      font-weight: bold;
    }

    .card svg {
      max-width: 100%;
      max-height: 100%;
    }

    .card-deck {
      width: 75px;
      height: 105px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: 2px solid #1e293b;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 2px 3px 0px #1e293b;
      user-select: none;
      position: relative;
    }

    .card-deck small {
      margin-top: 4px;
      font-size: 11px;
      background: rgba(0, 0, 0, 0.25);
      padding: 2px 6px;
      border-radius: 10px;
    }

    .card-placeholder {
      width: 75px;
      height: 105px;
      border: 2px dashed #94a3b8;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #64748b;
      font-size: 12px;
      text-align: center;
    }

    /* Section 4: Vertical 3D Braid */
    .section-4 {
      grid-column: 2;
      grid-row: 1 / span 2;
      background: #0f172a;
      border: 2.5px solid #1e293b;
      border-radius: 12px;
      box-shadow: 3px 3px 0px #1e293b;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      touch-action: none;
      user-select: none;
    }

    #braid-canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .braid-ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 12px;
    }

    .braid-controls {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border: 2px solid #1e293b;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 3px 3px 0px #1e293b;
      color: #1e293b;
    }

    .top-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pos-btn {
      width: 38px;
      height: 38px;
      font-size: 15px;
      font-weight: bold;
      background: #ffffff;
      color: #1e293b;
      border: 2px solid #1e293b;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      box-shadow: 2px 2px 0px #1e293b;
    }

    .pos-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #1e293b;
    }

    .braid-word-box {
      flex: 1;
      background: #f1f5f9;
      border: 1.5px solid #1e293b;
      border-radius: 8px;
      padding: 6px 12px;
      text-align: center;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: auto;
    }

    .braid-word {
      font-size: 16px;
      font-weight: bold;
      color: #0284c7;
      font-family: monospace;
      white-space: nowrap;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .info-badge {
      flex: 1;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 11px;
      color: #475569;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .info-badge b {
      color: #0f172a;
    }

    .gen-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .braid-gen-btn {
      padding: 8px 0;
      font-size: 15px;
      font-weight: bold;
      background: #0284c7;
      color: white;
      border: 2px solid #1e293b;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 2px 2px 0px #1e293b;
      transition: transform 0.1s, background 0.2s;
    }

    .braid-gen-btn:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }

    .braid-gen-btn.inv {
      background: #7c3aed;
    }

    .braid-gen-btn.inv:hover {
      background: #6d28d9;
    }

    .action-row {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-top: 2px;
    }

    .braid-act-btn {
      flex: 1;
      padding: 6px 0;
      font-size: 11px;
      font-weight: 700;
      background: #ffffff;
      color: #1e293b;
      border: 1.5px solid #1e293b;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 1px 2px 0px #1e293b;
    }

    .braid-act-btn.danger {
      background: #ef4444;
      color: #ffffff;
    }

    .braid-act-btn:hover {
      filter: brightness(0.95);
    }

    /* Section 5 & 6 */
    .section-5, .section-6 {
      background: #ffffff;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 3px 3px 0px #1e293b;
      padding: 15px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .section-5 { grid-column: 3; grid-row: 1; }
    .section-6 { grid-column: 3; grid-row: 2; }

    .deck-slot, .component-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .slot-label {
      font-size: 12px;
      color: #475569;
      font-weight: 700;
    }

    #dice-canvas-container {
      width: 130px;
      height: 130px;
    }

    .dice-result-label {
      margin-top: 4px;
      font-size: 18px;
      font-weight: bold;
      color: #0284c7;
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .coin-wrapper { perspective: 1000px; }

    .coin {
      width: 70px;
      height: 70px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .coin-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      backface-visibility: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: bold;
      color: #1e293b;
      background: radial-gradient(circle, #fde047 0%, #eab308 100%);
      border: 3px solid #1e293b;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.2), 2px 3px 0px #1e293b;
    }

    .coin-back { transform: rotateY(180deg); }

    /* Mobile Optimization */
    @media (max-width: 768px) {
      body {
        height: auto;
        overflow-y: auto;
      }

      .game-board {
        display: flex;
        flex-direction: column;
        height: auto;
        gap: 16px;
      }

      .left-panel, .section-4, .section-5, .section-6 {
        width: 100%;
      }

      .section-4 {
        height: 480px;
        min-height: 450px;
      }
    }
  </style>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-header">
    <a href="index.html" class="brand-title">
      &larr; Braid Game
    </a>
    <div class="header-actions">
      <button class="btn-pencil" onclick="openTutorial()">
        <svg class="btn-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"></circle>
          <line x1="12" y1="17" x2="12" y2="11"></line>
          <line x1="12" y1="7" x2="12.01" y2="7"></line>
        </svg>
        Tutorial
      </button>
    </div>
  </header>

  <!-- Player Selection Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay active">
    <div class="modal-card">
      <h2>Select Players</h2>
      <div class="btn-group">
        <button class="btn-pencil" onclick="initGame(1)">1 Player</button>
        <button class="btn-pencil" onclick="initGame(2)">2 Players</button>
        <button class="btn-pencil" onclick="initGame(3)">3 Players</button>
      </div>
    </div>
  </div>

  <!-- Tutorial Overlay Modal -->
  <div id="tutorial-modal" class="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal-card">
      <h2>Tutorial</h2>
      <p>Still to be written.</p>
      <button class="btn-pencil" style="margin-left: auto; display: block;" onclick="closeTutorial()">Close</button>
    </div>
  </div>

  <!-- Game Board -->
  <div class="game-board">
    
    <!-- Left Panel: Players -->
    <div class="left-panel">
      <div class="player-slot" id="player-slot-1">
        <div class="player-header">
          <h3>Player 1</h3>
          <button class="btn-pencil" onclick="setActivePlayer(1)">Set Turn</button>
        </div>
        <div class="hand-container" id="hand-1"></div>
      </div>

      <div class="player-slot" id="player-slot-2">
        <div class="player-header">
          <h3>Player 2</h3>
          <button class="btn-pencil" onclick="setActivePlayer(2)">Set Turn</button>
        </div>
        <div class="hand-container" id="hand-2"></div>
      </div>

      <div class="player-slot" id="player-slot-3">
        <div class="player-header">
          <h3>Player 3</h3>
          <button class="btn-pencil" onclick="setActivePlayer(3)">Set Turn</button>
        </div>
        <div class="hand-container" id="hand-3"></div>
      </div>
    </div>

    <!-- Section 4: Vertical 3D Braid -->
    <div class="section-4" id="section-4">
      <div id="braid-canvas-container"></div>
      
      <div class="braid-ui">
        <div class="braid-controls">
          
          <div class="top-row">
            <button id="pos-top-btn" class="pos-btn" onclick="setInsertPosition('top')" title="Top (Start)">T</button>
            <div class="braid-word-box">
              <span class="braid-word" id="braidLabel">e</span>
            </div>
            <button id="pos-bottom-btn" class="pos-btn active" onclick="setInsertPosition('bottom')" title="Bottom (End)">B</button>
          </div>

          <div class="info-row">
            <div class="info-badge">Length: <b id="wordLengthVal">0</b></div>
            <div class="info-badge">Perm: <b id="permutationVal">(1)(2)(3)(4)</b></div>
          </div>

          <div class="gen-grid">
            <button class="braid-gen-btn" onclick="addGenerator(1, 1)">σ₁</button>
            <button class="braid-gen-btn" onclick="addGenerator(2, 1)">σ₂</button>
            <button class="braid-gen-btn" onclick="addGenerator(3, 1)">σ₃</button>
            
            <button class="braid-gen-btn inv" onclick="addGenerator(1, -1)">σ₁⁻¹</button>
            <button class="braid-gen-btn inv" onclick="addGenerator(2, -1)">σ₂⁻¹</button>
            <button class="braid-gen-btn inv" onclick="addGenerator(3, -1)">σ₃⁻¹</button>
          </div>

          <div class="action-row">
            <button class="braid-act-btn" onclick="undoGenerator()">Undo</button>
            <button class="braid-act-btn" onclick="normalizeBraid()">Simplify</button>
            <button class="braid-act-btn danger" onclick="resetBraid()">Reset</button>
          </div>

        </div>
      </div>
    </div>

    <!-- Section 5: Draw Deck & Discard Pile -->
    <div class="section-5">
      <div class="deck-slot">
        <span class="slot-label">Draw Deck</span>
        <div id="draw-deck-slot" class="card-deck" onclick="drawCard()">
          <span>DECK</span>
          <small id="deck-count">210</small>
        </div>
      </div>
      <div class="deck-slot">
        <span class="slot-label">Discard Pile (<span id="discard-count">0</span>)</span>
        <div id="played-card-slot" class="card-placeholder" onclick="reshuffleDiscard()">
          Empty
        </div>
      </div>
    </div>

    <!-- Section 6: D6 Dice & D2 Coin -->
    <div class="section-6">
      <div class="component-box">
        <span class="slot-label">Dice</span>
        <div id="dice-canvas-container"></div>
        <div id="dice-result-label" class="dice-result-label">$\sigma_1$</div>
      </div>
      <div class="component-box">
        <span class="slot-label">Coin</span>
        <div class="coin-wrapper" onclick="flipCoin()">
          <div class="coin" id="coin">
            <div class="coin-face coin-front">B</div>
            <div class="coin-face coin-back">T</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- External Scripts -->
  <script src="deck/cards.js"></script>
  <script src="dice/dice.js"></script>
  <script src="braid/braid.js"></script>

  <!-- Game Logic -->
  <script>
    let totalPlayers = 3;
    let activePlayer = 1;

    function initGame(num) {
      totalPlayers = num;
      document.getElementById('modal-overlay').classList.remove('active');

      for (let i = 1; i <= 3; i++) {
        const slot = document.getElementById(`player-slot-${i}`);
        if (i > totalPlayers) {
          slot.classList.add('disabled');
        } else {
          slot.classList.remove('disabled');
        }
      }

      if (typeof initDeckSystem === 'function') initDeckSystem();
      setActivePlayer(1);
    }

    function setActivePlayer(num) {
      if (num > totalPlayers) return;
      activePlayer = num;
      for (let i = 1; i <= totalPlayers; i++) {
        const slot = document.getElementById(`player-slot-${i}`);
        if (i === num) {
          slot.classList.add('active-turn');
        } else {
          slot.classList.remove('active-turn');
        }
      }
    }

    // D2 Coin Flip
    let currentCoinRotation = 0;
    function flipCoin() {
      const coin = document.getElementById('coin');
      const isH = Math.random() < 0.5;
      const extraFlips = (Math.floor(Math.random() * 5) + 5) * 360; 
      const targetAngle = isH ? 0 : 180;
      
      currentCoinRotation += extraFlips + targetAngle - (currentCoinRotation % 360);
      coin.style.transform = `rotateY(${currentCoinRotation}deg)`;
    }

    // Tutorial Modal Handlers
    function openTutorial() {
      document.getElementById('tutorial-modal').classList.add('active');
    }

    function closeTutorial() {
      document.getElementById('tutorial-modal').classList.remove('active');
    }

    function handleOverlayClick(event) {
      if (event.target.classList.contains('modal-overlay') && event.target.id === 'tutorial-modal') {
        closeTutorial();
      }
    }
  </script>

  <script>
    const diceFaceMap = {
      1: '\\sigma_1',
      2: '\\sigma_1^{-1}',
      3: '\\sigma_2',
      4: '\\sigma_2^{-1}',
      5: '\\sigma_3',
      6: '\\sigma_3^{-1}'
    };

    function updateDiceResult(faceNumber) {
      const labelEl = document.getElementById('dice-result-label');
      const latexFormula = diceFaceMap[faceNumber] || '\\sigma_1';
      labelEl.innerHTML = `$${latexFormula}$`;

      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([labelEl]);
      }
    }
  </script>
</body>
</html>
