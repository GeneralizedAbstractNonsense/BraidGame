<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Braid Theory - Braid Game</title>
  
  <!-- MathJax Configuration -->
  <script>
    MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: rgb(239, 239, 239);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 20px 40px 20px;
    }

    /* Top Navigation Header */
    .top-header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      background: #ffffff;
      border: 2.5px solid #1e293b;
      border-radius: 12px;
      box-shadow: 3px 3px 0px #1e293b;
      margin-bottom: 24px;
    }

    .brand-logo img {
      height: 32px;
      width: auto;
      display: block;
      transition: transform 0.15s ease;
    }

    .brand-logo img:hover {
      transform: scale(1.05);
    }

    /* Pencil / Hand-drawn Style Button */
    .btn-pencil {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
      background-color: #ffffff;
      border: 2px solid #1e293b;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 2px 3px 0px #1e293b;
      transition: all 0.15s ease-in-out;
      user-select: none;
    }

    .btn-pencil:hover {
      background-color: #f8fafc;
      transform: scale(1.03) rotate(-1deg);
      box-shadow: 4px 4px 0px #1e293b;
      color: #0284c7;
      border-color: #0284c7;
    }

    .btn-pencil:hover svg {
      fill: #0284c7;
      stroke: #0284c7;
    }

    .btn-icon {
      width: 15px;
      height: 15px;
      fill: #1e293b;
      stroke-width: 0;
    }

    /* Main Container */
    .content-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Page Title Box */
    .page-title-box {
      background: #ffffff;
      border: 2.5px solid #1e293b;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      box-shadow: 5px 6px 0px #1e293b;
      padding: 28px;
      text-align: center;
    }

    .page-title-box h1 {
      font-size: 28px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .page-title-box p {
      font-size: 15px;
      color: #475569;
    }

    /* Theory Card Section */
    .theory-card {
      background: #ffffff;
      border: 2.5px solid #1e293b;
      border-radius: 12px;
      box-shadow: 4px 5px 0px #1e293b;
      padding: 24px 28px;
      line-height: 1.7;
    }

    .theory-card h2 {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px dashed #cbd5e1;
      padding-bottom: 8px;
    }

    .theory-card h3 {
      font-size: 17px;
      font-weight: 700;
      color: #0369a1;
      margin: 18px 0 10px 0;
    }

    .theory-card p {
      font-size: 15px;
      color: #334155;
      margin-bottom: 12px;
    }

    .theory-card ul, .theory-card ol {
      margin: 10px 0 14px 24px;
      color: #334155;
      font-size: 15px;
    }

    .theory-card li {
      margin-bottom: 6px;
    }

    /* Highlight Math Block */
    .math-block {
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-left: 4px solid #0284c7;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 12px 0;
      overflow-x: auto;
    }

    /* Footer */
    footer {
      margin-top: 40px;
      width: 100%;
      max-width: 900px;
      font-size: 11px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
    }

    footer a {
      color: #64748b;
      text-decoration: none;
      transition: color 0.2s ease;
      display: inline-flex;
      align-items: center;
    }

    footer a:hover {
      color: #0f172a;
      text-decoration: underline;
    }

    .github-icon {
      width: 16px;
      height: 16px;
      fill: #64748b;
      transition: fill 0.2s ease, transform 0.2s ease;
    }

    .github-link:hover .github-icon {
      fill: #0f172a;
      transform: scale(1.15);
    }

    /* Mobile Responsive */
    @media (max-width: 600px) {
      .theory-card {
        padding: 18px;
      }

      .page-title-box {
        padding: 20px;
      }

      .page-title-box h1 {
        font-size: 22px;
      }

      footer {
        justify-content: center;
        flex-direction: column;
        gap: 8px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-header">
    <a href="index.html" class="brand-logo" title="Back to Home">
      <img src="media/logo.png" alt="Braid Game Logo">
    </a>
    <a href="game.html" class="btn-pencil">
      <svg class="btn-icon" viewBox="0 0 24 24">
        <polygon points="6,4 20,12 6,20"></polygon>
      </svg>
      Play Game
    </a>
  </header>

  <!-- Main Theory Content -->
  <main class="content-container">

    <!-- Title Header -->
    <div class="page-title-box">
      <h1>Braids.</h1>
      <p>Work in progress.</p>
    </div>

    <!-- Section 1 -->
    <section class="theory-card">
      <h2>1. What is a Braid?</h2>
    </section>

    <!-- Section 2 -->
    <section class="theory-card">
      <h2>2. Braid Moves and Relations</h2>
    </section>

    <!-- Section 3 -->
    <section class="theory-card">
      <h2>3. What is a Group?</h2>
    </section>

    <!-- Section 4 -->
    <section class="theory-card">
      <h2>4. The Braid Group $B_4$</h2>

      <h3>4.1 The Symmetric Group ($S_4$)</h3>
    </section>

    <!-- Section 5 -->
    <section class="theory-card">
      <h2>5. Group Actions on a Set</h2>
    </section>

  </main>

  <!-- Footer -->
  <footer>
    <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener noreferrer">
      Creative Commons Attribution-NonCommercial 4.0 International License
    </a>

      </svg>
    </a>
  </footer>

</body>
</html>
