<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BraidGame</title>
  
  <script>
    MathJax = {
      tex: { inlineMath: [['$', '$']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1e272e;
      color: #f5f6fa;
      height: 100vh;
      overflow: hidden;
    }

    /* Modal */
    #modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background: #2f3640;
      padding: 30px 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #718093;
    }

    .modal h2 { margin-bottom: 20px; color: #f5f6fa; }

    .btn-group {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .btn-player {
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      background: #00a8ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-player:hover {
      background: #0097e6;
      transform: translateY(-2px);
    }

    /* Main Grid Layout */
    .game-board {
      display: grid;
      grid-template-columns: 340px 1fr 360px;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      height: 100vh;
      padding: 12px;
    }

    .left-panel {
      grid-column: 1;
      grid-row: 1 / span 2;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .player-slot {
      flex: 1;
      background: #353b48;
      border: 2px solid #718093;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      transition: border-color 0.3s, background-color 0.3s;
    }

    .player-slot.active-turn {
      border-color: #4cd137;
      background: #2d383c;
      box-shadow: inset 0 0 10px rgba(76, 209, 55, 0.2);
    }

    .player-slot.disabled {
      opacity: 0.35;
      pointer-events: none;
      filter: grayscale(80%);
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .player-header h3 { font-size: 15px; color: #f5f6fa; }

    .turn-btn {
      padding: 4px 10px;
      font-size: 12px;
      background: #487eb0;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .turn-btn:hover { background: #40739e; }

    .hand-container {
      flex: 1;
      display: flex;
      gap: 8px;
      align-items: center;
      overflow-x: auto;
      padding: 8px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 6px;
      min-height: 110px;
    }

    .card {
      width: 75px;
      height: 105px;
      background: #f8f9fa;
      color: #1e272e;
      border: 2px solid #2f3640;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      flex-shrink: 0;
      padding: 4px;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 16px rgba(0,0,0,0.5);
    }

    .card.jolly-card {
      background: linear-gradient(135deg, #f1c40f, #e67e22);
      color: #ffffff;
      border-color: #f39c12;
      font-weight: bold;
    }

    .card svg {
      max-width: 100%;
      max-height: 100%;
    }

    .card-deck {
      width: 75px;
      height: 105px;
      background: linear-gradient(135deg, #e1b12c, #e67e22);
      border: 2px solid #f5f6fa;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      user-select: none;
      position: relative;
    }

    .card-deck small {
      margin-top: 4px;
      font-size: 11px;
      background: rgba(0,0,0,0.3);
      padding: 2px 6px;
      border-radius: 10px;
    }

    .card-placeholder {
      width: 75px;
      height: 105px;
      border: 2px dashed #718093;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #718093;
      font-size: 12px;
      text-align: center;
    }

    /* Section 4: Vertical 3D Braid */
    .section-4 {
      grid-column: 2;
      grid-row: 1 / span 2;
      background: #090d16;
      border: 2px solid #718093;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      touch-action: none;
      user-select: none;
    }

    #braid-canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .braid-ui {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 12px;
}

    .braid-header {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .braid-title {
      font-size: 14px;
      font-weight: bold;
      color: #f8fafc;
    }

    .braid-word-box {
  flex: 1;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  padding: 6px 12px;
  text-align: center;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: auto;
}

.braid-word {
  font-size: 16px;
  font-weight: bold;
  color: #38bdf8;
  font-family: monospace;
  white-space: nowrap;
}

    .info-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.info-badge {
  flex: 1;
  background: rgba(30, 41, 59, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 6px;
  padding: 5px 8px;
  font-size: 11px;
  color: #94a3b8;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

    .info-badge b {
  color: #f8fafc;
}
    

    .scroll-hint {
      position: absolute;
      top: 52px;
      right: 14px;
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }

    .braid-controls {
  pointer-events: auto;
  background: rgba(15, 23, 42, 0.88);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

    .top-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

    .pos-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      color: #cbd5e1;
    }

   .pos-btn {
  width: 38px;
  height: 38px;
  font-size: 15px;
  font-weight: bold;
  background: rgba(51, 65, 85, 0.8);
  color: #e2e8f0;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}

.pos-btn.active {
  background: #00a8ff;
  color: #ffffff;
  border-color: #0097e6;
  box-shadow: 0 0 8px rgba(0, 168, 255, 0.5);
}

    .gen-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .braid-gen-btn {
      padding: 6px 12px;
      font-size: 13px;
      font-weight: bold;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    .braid-gen-btn:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }

    .braid-gen-btn.inv {
      background: #8b5cf6;
    }

    .braid-gen-btn.inv:hover {
      background: #7c3aed;
    }

    .gen-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.braid-gen-btn {
  padding: 8px 0;
  font-size: 15px;
  font-weight: bold;
  background: #3b82f6;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.1s, background 0.2s;
}

.braid-gen-btn:hover {
  background: #2563eb;
  transform: translateY(-1px);
}

.braid-gen-btn.inv {
  background: #8b5cf6;
}

.braid-gen-btn.inv:hover {
  background: #7c3aed;
}

    .action-row {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  margin-top: 2px;
}

.braid-act-btn {
  flex: 1;
  padding: 6px 0;
  font-size: 11px;
  font-weight: 600;
  background: rgba(51, 65, 85, 0.9);
  color: #f1f5f9;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 6px;
  cursor: pointer;
}

.braid-act-btn.danger {
  background: rgba(225, 29, 72, 0.85);
}

.braid-act-btn:hover {
  filter: brightness(1.15);
}

   

    .braid-info {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      justify-content: space-around;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 4px;
    }

    .section-5 {
      grid-column: 3;
      grid-row: 1;
      background: #353b48;
      border: 2px solid #718093;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .deck-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .slot-label {
      font-size: 12px;
      color: #dcdde1;
      font-weight: 600;
    }

    .section-6 {
      grid-column: 3;
      grid-row: 2;
      background: #353b48;
      border: 2px solid #718093;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .component-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #dice-canvas-container {
      width: 140px;
      height: 140px;
    }

    .dice-result-label {
      margin-top: 6px;
      font-size: 18px;
      font-weight: bold;
      color: #38bdf8;
      min-height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .coin-wrapper { perspective: 1000px; }

    .coin {
      width: 75px;
      height: 75px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .coin-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      backface-visibility: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      font-weight: bold;
      color: #1e272e;
      background: radial-gradient(circle, #fbc531 0%, #e1b12c 100%);
      border: 4px solid #f5cd79;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.4), 0 4px 8px rgba(0,0,0,0.3);
    }

    .coin-back { transform: rotateY(180deg); }

    /* Mobile Optimization */
    @media (max-width: 768px) {
      body {
        height: auto;
        overflow-y: auto;
      }

      .game-board {
        display: flex;
        flex-direction: column;
        height: auto;
        padding: 8px;
        gap: 16px;
      }

      .left-panel, .section-4, .section-5, .section-6 {
        width: 100%;
      }

      .section-4 {
        height: 480px;
        min-height: 450px;
      }

      .braid-controls {
        padding: 8px;
        gap: 6px;
      }

      .braid-gen-btn {
        padding: 8px 12px;
        font-size: 14px;
        min-width: 44px;
      }

      .pos-selector {
        flex-wrap: wrap;
      }

      .hand-container {
        min-height: 100px;
      }

      .card, .card-deck, .card-placeholder {
        width: 65px;
        height: 90px;
      }

      .modal {
        width: 90%;
        max-width: 360px;
        padding: 20px 15px;
      }

      .btn-group {
        flex-direction: column;
        gap: 10px;
      }

      .btn-player {
        width: 100%;
        padding: 14px;
      }
    }
  </style>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Modal -->
  <div id="modal-overlay">
    <div class="modal">
      <h2>Select Number of Players</h2>
      <div class="btn-group">
        <button class="btn-player" onclick="initGame(1)">1 Player</button>
        <button class="btn-player" onclick="initGame(2)">2 Players</button>
        <button class="btn-player" onclick="initGame(3)">3 Players</button>
      </div>
    </div>
  </div>

  <!-- Game Board -->
  <div class="game-board">
    
    <!-- Left Panel: Players -->
    <div class="left-panel">
      <div class="player-slot" id="player-slot-1">
        <div class="player-header">
          <h3>Player 1</h3>
          <button class="turn-btn" onclick="setActivePlayer(1)">Set Turn</button>
        </div>
        <div class="hand-container" id="hand-1"></div>
      </div>

      <div class="player-slot" id="player-slot-2">
        <div class="player-header">
          <h3>Player 2</h3>
          <button class="turn-btn" onclick="setActivePlayer(2)">Set Turn</button>
        </div>
        <div class="hand-container" id="hand-2"></div>
      </div>

      <div class="player-slot" id="player-slot-3">
        <div class="player-header">
          <h3>Player 3</h3>
          <button class="turn-btn" onclick="setActivePlayer(3)">Set Turn</button>
        </div>
        <div class="hand-container" id="hand-3"></div>
      </div>
    </div>

   <!-- Section 4: Vertical 3D Braid -->
<div class="section-4" id="section-4">
  <div id="braid-canvas-container"></div>
  
  <div class="braid-ui">
    <div class="braid-controls">
      

      <div class="top-row">
        <button id="pos-top-btn" class="pos-btn" onclick="setInsertPosition('top')" title="Top (Start)">T</button>
        <div class="braid-word-box">
          <span class="braid-word" id="braidLabel">e</span>
        </div>
        <button id="pos-bottom-btn" class="pos-btn active" onclick="setInsertPosition('bottom')" title="Bottom (End)">B</button>
      </div>


      <div class="info-row">
        <div class="info-badge">Length: <b id="wordLengthVal">0</b></div>
        <div class="info-badge">Perm: <b id="permutationVal">(1)(2)(3)(4)</b></div>
      </div>

  
      <div class="gen-grid">
        <button class="braid-gen-btn" onclick="addGenerator(1, 1)">σ₁</button>
        <button class="braid-gen-btn" onclick="addGenerator(2, 1)">σ₂</button>
        <button class="braid-gen-btn" onclick="addGenerator(3, 1)">σ₃</button>
        
        <button class="braid-gen-btn inv" onclick="addGenerator(1, -1)">σ₁⁻¹</button>
        <button class="braid-gen-btn inv" onclick="addGenerator(2, -1)">σ₂⁻¹</button>
        <button class="braid-gen-btn inv" onclick="addGenerator(3, -1)">σ₃⁻¹</button>
      </div>

    
      <div class="action-row">
        <button class="braid-act-btn" onclick="undoGenerator()">Undo</button>
        <button class="braid-act-btn" onclick="normalizeBraid()">Simplify</button>
        <button class="braid-act-btn danger" onclick="resetBraid()">Reset</button>
      </div>

    </div>
  </div>
</div>

    <!-- Section 5: Draw Deck & Discard Pile -->
    <div class="section-5">
      <div class="deck-slot">
        <span class="slot-label">Draw Deck</span>
        <div id="draw-deck-slot" class="card-deck" onclick="drawCard()">
          <span>DECK</span>
          <small id="deck-count">210</small>
        </div>
      </div>
      <div class="deck-slot">
        <span class="slot-label">Discard Pile (<span id="discard-count">0</span>)</span>
        <div id="played-card-slot" class="card-placeholder" onclick="reshuffleDiscard()">
          Empty
        </div>
      </div>
    </div>

    <!-- Section 6: D6 Dice & D2 Coin -->
    <div class="section-6">
      <div class="component-box">
        <span class="slot-label">Dice</span>
        <div id="dice-canvas-container"></div>
        <div id="dice-result-label" class="dice-result-label">$\sigma_1$</div>
      </div>
      <div class="component-box">
        <span class="slot-label">Coin</span>
        <div class="coin-wrapper" onclick="flipCoin()">
          <div class="coin" id="coin">
            <div class="coin-face coin-front">B</div>
            <div class="coin-face coin-back">T</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- External Scripts -->
  <script src="deck/cards.js"></script>
  <script src="dice/dice.js"></script>
  <script src="braid/braid.js"></script>

  <!-- Game Logic & Vertical 3D Braid Visualizer -->
  <script>
    let totalPlayers = 3;
    let activePlayer = 1;

    function initGame(num) {
      totalPlayers = num;
      document.getElementById('modal-overlay').style.display = 'none';

      for (let i = 1; i <= 3; i++) {
        const slot = document.getElementById(`player-slot-${i}`);
        if (i > totalPlayers) {
          slot.classList.add('disabled');
        } else {
          slot.classList.remove('disabled');
        }
      }

      if (typeof initDeckSystem === 'function') initDeckSystem();
      setActivePlayer(1);
    }

    function setActivePlayer(num) {
      if (num > totalPlayers) return;
      activePlayer = num;
      for (let i = 1; i <= totalPlayers; i++) {
        const slot = document.getElementById(`player-slot-${i}`);
        if (i === num) {
          slot.classList.add('active-turn');
        } else {
          slot.classList.remove('active-turn');
        }
      }
    }

    // D2 Coin Flip
    let currentCoinRotation = 0;
    function flipCoin() {
      const coin = document.getElementById('coin');
      const isH = Math.random() < 0.5;
      const extraFlips = (Math.floor(Math.random() * 5) + 5) * 360; 
      const targetAngle = isH ? 0 : 180;
      
      currentCoinRotation += extraFlips + targetAngle - (currentCoinRotation % 360);
      coin.style.transform = `rotateY(${currentCoinRotation}deg)`;
    }
  </script>


  <script>
    const diceFaceMap = {
      1: '\\sigma_1',
      2: '\\sigma_1^{-1}',
      3: '\\sigma_2',
      4: '\\sigma_2^{-1}',
      5: '\\sigma_3',
      6: '\\sigma_3^{-1}'
    };

    function updateDiceResult(faceNumber) {
      const labelEl = document.getElementById('dice-result-label');
      const latexFormula = diceFaceMap[faceNumber] || '\\sigma_1';
      labelEl.innerHTML = `$${latexFormula}$`;

      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([labelEl]);
      }
    }
  </script>
</body>
</html>
