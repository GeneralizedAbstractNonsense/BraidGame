<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Braid</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: rgb(239, 239, 239);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 40px 20px 20px 20px;
      position: relative;
    }

    /* Main Container */
    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 40px;
      width: 100%;
      max-width: 800px;
      text-align: center;
      margin-top: 2vh; /* Posiziona il logo più in alto */
    }

    /* Centered & Enlarged Logo */
    .logo-container img {
      max-width: 420px; /* Logo più grande */
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      user-select: none;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
    }

    /* Horizontal Buttons Container */
    .nav-buttons {
      display: flex;
      flex-direction: row;
      gap: 20px;
      justify-content: center;
      align-items: center;
      width: 100%;
      flex-wrap: wrap;
    }

    /* Pencil / Hand-drawn Style Button */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 26px;
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
      background-color: #ffffff;
      /* Bordo irregolare stile disegno a mano libera */
      border: 2.5px solid #1e293b;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      text-decoration: none;
      cursor: pointer;
      /* Ombra schizzata / trattino */
      box-shadow: 3px 4px 0px #1e293b;
      transition: all 0.2s ease-in-out;
      min-width: 130px;
      user-select: none;
    }

    .btn:hover {
      background-color: #f8fafc;
      transform: scale(1.04) rotate(-1deg);
      box-shadow: 5px 6px 0px #1e293b;
      color: #0284c7;
      border-color: #0284c7;
    }

    .btn:hover svg {
      stroke: #0284c7;
      fill: #0284c7;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 2px 0px #1e293b;
    }

    /* SVG Icon Style */
    .btn-icon {
      width: 18px;
      height: 18px;
      stroke: #1e293b;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: all 0.2s ease;
    }

    .btn-icon.filled {
      fill: #1e293b;
    }

    /* Tutorial Overlay Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #ffffff;
      padding: 32px;
      /* Stile matita anche per il modal */
      border: 2.5px solid #1e293b;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      box-shadow: 6px 8px 0px #1e293b;
      max-width: 480px;
      width: 100%;
      text-align: left;
      transform: translateY(12px);
      transition: transform 0.25s ease;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-card h2 {
      font-size: 22px;
      margin-bottom: 12px;
      color: #0f172a;
    }

    .modal-card p {
      font-size: 14px;
      line-height: 1.6;
      color: #475569;
      margin-bottom: 24px;
    }

    .modal-close-btn {
      display: block;
      margin-left: auto;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 700;
      background: #ffffff;
      color: #1e293b;
      border: 2px solid #1e293b;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      box-shadow: 2px 3px 0px #1e293b;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modal-close-btn:hover {
      background: #f1f5f9;
      transform: translate(-1px, -1px);
      box-shadow: 3px 4px 0px #1e293b;
    }

    /* Clickable Footer in Bottom-Right */
    /* Clickable Footer in Bottom-Right */
footer {
  position: absolute;
  bottom: 16px;
  right: 20px;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 10px;
}

footer a {
  color: #64748b;
  text-decoration: none;
  transition: color 0.2s ease;
  display: inline-flex;
  align-items: center;
}

footer a:hover {
  color: #0f172a;
  text-decoration: underline;
}

.github-icon {
  width: 16px;
  height: 16px;
  fill: #64748b;
  transition: fill 0.2s ease, transform 0.2s ease;
}

.github-link:hover .github-icon {
  fill: #0f172a;
  transform: scale(1.15);
}

    /* Mobile Responsiveness */
    @media (max-width: 600px) {
      body {
        padding-top: 20px;
      }

      .main-container {
        margin-top: 0;
        gap: 30px;
      }

      .logo-container img {
        max-width: 300px;
      }

      .nav-buttons {
        flex-direction: column;
        width: 100%;
        max-width: 240px;
      }

      .btn {
        width: 100%;
      }

      footer {
        position: static;
        margin-top: 50px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <main class="main-container">
    <!-- Center Logo (media/logo.png) -->
    <div class="logo-container">
      <img src="media/logo.png" alt="Braid Game Logo">
    </div>

    <!-- Navigation Buttons -->
    <nav class="nav-buttons">
      <!-- 1. Tutorial Button with Info Icon -->
      <button class="btn" onclick="openTutorial()">
        <svg class="btn-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"></circle>
          <line x1="12" y1="17" x2="12" y2="11"></line>
          <line x1="12" y1="7" x2="12.01" y2="7"></line>
        </svg>
        <span>Tutorial</span>
      </button>

      <!-- 2. Play Button with Classic Play Triangle -->
      <a href="game.html" class="btn">
        <svg class="btn-icon filled" viewBox="0 0 24 24">
          <polygon points="6,4 20,12 6,20"></polygon>
        </svg>
        <span>Play</span>
      </a>

      <!-- 3. Theory Button with Book/Theory Icon -->
      <a href="theory.html" class="btn">
        <svg class="btn-icon" viewBox="0 0 24 24">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span>Theory</span>
      </a>
    </nav>
  </main>

  <!-- Tutorial Modal Overlay -->
  <div id="tutorial-modal" class="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal-card">
      <h2>Tutorial</h2>
      <p>Still to be written.</p>
      <button class="modal-close-btn" onclick="closeTutorial()">Close</button>
    </div>
  </div>

  <!-- Bottom-Right Copyright Footer -->
<footer>
  <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener noreferrer">
    Creative Commons Attribution-NonCommercial 4.0 International License
  </a>
  <a href="https://github.com/GeneralizedAbstractNonsense/BraidGame" target="_blank" rel="noopener noreferrer" class="github-link" title="GitHub Repository">
    <svg class="github-icon" viewBox="0 0 24 24">
      <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
    </svg>
  </a>
</footer>

  <script>
    function openTutorial() {
      document.getElementById('tutorial-modal').classList.add('active');
    }

    function closeTutorial() {
      document.getElementById('tutorial-modal').classList.remove('active');
    }

    function handleOverlayClick(event) {
      if (event.target.classList.contains('modal-overlay')) {
        closeTutorial();
      }
    }
  </script>

</body>
</html>
