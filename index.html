<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BraidGame</title>
  
  <script>
    MathJax = {
      tex: { inlineMath: [['$', '$']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <!-- Three.js CDN Globale -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1e272e;
      color: #f5f6fa;
      height: 100vh;
      overflow: hidden;
    }

    /* Modal */
    #modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background: #2f3640;
      padding: 30px 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #718093;
    }

    .modal h2 { margin-bottom: 20px; color: #f5f6fa; }

    .btn-group {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .btn-player {
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      background: #00a8ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-player:hover {
      background: #0097e6;
      transform: translateY(-2px);
    }

    /* Layout Griglia Principale */
    .game-board {
      display: grid;
      grid-template-columns: 340px 1fr 360px;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      height: 100vh;
      padding: 12px;
    }

    .left-panel {
      grid-column: 1;
      grid-row: 1 / span 2;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .player-slot {
      flex: 1;
      background: #353b48;
      border: 2px solid #718093;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      transition: border-color 0.3s, background-color 0.3s;
    }

    .player-slot.active-turn {
      border-color: #4cd137;
      background: #2d383c;
      box-shadow: inset 0 0 10px rgba(76, 209, 55, 0.2);
    }

    .player-slot.disabled {
      opacity: 0.35;
      pointer-events: none;
      filter: grayscale(80%);
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .player-header h3 { font-size: 15px; color: #f5f6fa; }

    .turn-btn {
      padding: 4px 10px;
      font-size: 12px;
      background: #487eb0;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .turn-btn:hover { background: #40739e; }

    .hand-container {
      flex: 1;
      display: flex;
      gap: 8px;
      align-items: center;
      overflow-x: auto;
      padding: 8px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 6px;
      min-height: 110px;
    }

    .card {
      width: 75px;
      height: 105px;
      background: #f8f9fa;
      color: #1e272e;
      border: 2px solid #2f3640;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      flex-shrink: 0;
      padding: 4px;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 16px rgba(0,0,0,0.5);
    }

    .card-deck {
      width: 75px;
      height: 105px;
      background: linear-gradient(135deg, #e1b12c, #e67e22);
      border: 2px solid #f5f6fa;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      user-select: none;
      position: relative;
    }

    .card-deck small {
      margin-top: 4px;
      font-size: 11px;
      background: rgba(0,0,0,0.3);
      padding: 2px 6px;
      border-radius: 10px;
    }

    .card-placeholder {
      width: 75px;
      height: 105px;
      border: 2px dashed #718093;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #718093;
      font-size: 12px;
      text-align: center;
    }

    /* Sezione 4 - Contenitore della Treccia 3D */
    .section-4 {
      grid-column: 2;
      grid-row: 1 / span 2;
      background: #2f3640;
      border: 2px solid #718093;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }

    .section-5 {
      grid-column: 3;
      grid-row: 1;
      background: #353b48;
      border: 2px solid #718093;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .deck-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .slot-label {
      font-size: 12px;
      color: #dcdde1;
      font-weight: 600;
    }

    .section-6 {
      grid-column: 3;
      grid-row: 2;
      background: #353b48;
      border: 2px solid #718093;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .component-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #dice-canvas-container {
      width: 90px;
      height: 90px;
    }

    .coin-wrapper { perspective: 1000px; }

    .coin {
      width: 75px;
      height: 75px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .coin-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      backface-visibility: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      font-weight: bold;
      color: #1e272e;
      background: radial-gradient(circle, #fbc531 0%, #e1b12c 100%);
      border: 4px solid #f5cd79;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.4), 0 4px 8px rgba(0,0,0,0.3);
    }

    .coin-back { transform: rotateY(180deg); }
  </style>
</head>
<body>

  <!-- Modal -->
  <div id="modal-overlay">
    <div class="modal">
      <h2>Seleziona Numero Giocatori</h2>
      <div class="btn-group">
        <button class="btn-player" onclick="initGame(1)">1 Giocatore</button>
        <button class="btn-player" onclick="initGame(2)">2 Giocatori</button>
        <button class="btn-player" onclick="initGame(3)">3 Giocatori</button>
      </div>
    </div>
  </div>

  <!-- Tabellone di Gioco -->
  <div class="game-board">
    
    <!-- Pannello Sinistro: Giocatori -->
    <div class="left-panel">
      <div class="player-slot" id="player-slot-1">
        <div class="player-header">
          <h3>Giocatore 1</h3>
          <button class="turn-btn" onclick="setActivePlayer(1)">Imposta Turno</button>
        </div>
        <div class="hand-container" id="hand-1"></div>
      </div>

      <div class="player-slot" id="player-slot-2">
        <div class="player-header">
          <h3>Giocatore 2</h3>
          <button class="turn-btn" onclick="setActivePlayer(2)">Imposta Turno</button>
        </div>
        <div class="hand-container" id="hand-2"></div>
      </div>

      <div class="player-slot" id="player-slot-3">
        <div class="player-header">
          <h3>Giocatore 3</h3>
          <button class="turn-btn" onclick="setActivePlayer(3)">Imposta Turno</button>
        </div>
        <div class="hand-container" id="hand-3"></div>
      </div>
    </div>

    <!-- Sezione 4: Contenitore Treccia 3D -->
    <div class="section-4" id="braid-container"></div>

    <!-- Sezione 5: Mazzo di Pesca & Scarti -->
    <div class="section-5">
      <div class="deck-slot">
        <span class="slot-label">Mazzo Pesca</span>
        <div id="draw-deck-slot" class="card-deck" onclick="drawCard()">
          <span>MAZZO</span>
          <small id="deck-count">210</small>
        </div>
      </div>
      <div class="deck-slot">
        <span class="slot-label">Mazzo Scarti (<span id="discard-count">0</span>)</span>
        <div id="played-card-slot" class="card-placeholder" onclick="reshuffleDiscard()">
          Vuoto
        </div>
      </div>
    </div>

    <!-- Sezione 6: Dado D6 e Moneta D2 -->
    <div class="section-6">
      <div class="component-box">
        <span class="slot-label">Dado D6 (3D)</span>
        <div id="dice-canvas-container"></div>
      </div>
      <div class="component-box">
        <span class="slot-label">Moneta D2</span>
        <div class="coin-wrapper" onclick="flipCoin()">
          <div class="coin" id="coin">
            <div class="coin-face coin-front">R</div>
            <div class="coin-face coin-back">L</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- SCRIPT ESTERNI (In ordine di dipendenza) -->
  <script src="braid/braid.js"></script>
  <script src="deck/cards.js"></script>
  <script src="dice/dice.js"></script>

  <!-- Logica Generale del Gioco -->
  <script>
    let totalPlayers = 3;
    let activePlayer = 1;

    function initGame(num) {
      totalPlayers = num;
      document.getElementById('modal-overlay').style.display = 'none';

      for (let i = 1; i <= 3; i++) {
        const slot = document.getElementById(`player-slot-${i}`);
        if (i > totalPlayers) {
          slot.classList.add('disabled');
        } else {
          slot.classList.remove('disabled');
        }
      }

      if (typeof initDeckSystem === 'function') {
        initDeckSystem();
      }
      setActivePlayer(1);
    }

    function setActivePlayer(num) {
      if (num > totalPlayers) return;
      activePlayer = num;
      for (let i = 1; i <= totalPlayers; i++) {
        const slot = document.getElementById(`player-slot-${i}`);
        if (i === num) {
          slot.classList.add('active-turn');
        } else {
          slot.classList.remove('active-turn');
        }
      }
    }

    // Moneta D2
    let currentCoinRotation = 0;
    function flipCoin() {
      const coin = document.getElementById('coin');
      const isR = Math.random() < 0.5;
      const extraFlips = (Math.floor(Math.random() * 5) + 5) * 360; 
      const targetAngle = isR ? 0 : 180;
      
      currentCoinRotation += extraFlips + targetAngle - (currentCoinRotation % 360);
      coin.style.transform = `rotateY(${currentCoinRotation}deg)`;
    }
  </script>

  <!-- Inizializzazione della Treccia 3D -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('braid-container');

      let width = container.clientWidth || 600;
      let height = container.clientHeight || 500;

      // Scena e Camera Three.js
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x2f3640);

      const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Luci
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(10, 20, 15);
      scene.add(dirLight);

      camera.position.set(0, 0, 18);

      // Creo il BraidManager
      window.braidManager = new BraidManager(scene, {
        numStrands: 4,
        onWordChange: (word) => {
          console.log("Stato treccia aggiornato:", word);
        }
      });

      // Attivo interazione click sugli incroci
      window.braidManager.setupInteractivity(camera, renderer.domElement);

      // Imposto sequenza di test
      window.braidManager.setWord([
        { index: 0, type: 1 },  // sigma_1
        { index: 1, type: 1 },  // sigma_2
        { index: 1, type: -1 }, // inv(sigma_2) -> auto-annullato
        { index: 2, type: 1 }   // sigma_3
      ]);

      // Resize dinamico
      const resizeObserver = new ResizeObserver(() => {
        width = container.clientWidth;
        height = container.clientHeight;
        if (width > 0 && height > 0) {
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          renderer.setSize(width, height);
        }
      });
      resizeObserver.observe(container);

      // Loop di animazione
      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate();
    });
  </script>
</body>
</html>
