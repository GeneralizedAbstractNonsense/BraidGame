<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board Game Interface</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1e272e;
      color: #f5f6fa;
      height: 100vh;
      overflow: hidden;
    }

    /* Modal for initial setup */
    #modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background: #2f3640;
      padding: 30px 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #718093;
    }

    .modal h2 {
      margin-bottom: 20px;
      color: #f5f6fa;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .btn-player {
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      background: #00a8ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-player:hover {
      background: #0097e6;
      transform: translateY(-2px);
    }

    /* Main Grid Layout */
    .game-board {
      display: grid;
      grid-template-columns: 320px 1fr 340px;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      height: 100vh;
      padding: 12px;
    }

    /* Left Panel: Sections 1, 2, 3 */
    .left-panel {
      grid-column: 1;
      grid-row: 1 / span 2;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .player-slot {
      flex: 1;
      background: #353b48;
      border: 2px solid #718093;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      transition: border-color 0.3s, background-color 0.3s;
    }

    .player-slot.active-turn {
      border-color: #4cd137;
      background: #2d383c;
      box-shadow: inset 0 0 10px rgba(76, 209, 55, 0.2);
    }

    .player-slot.disabled {
      opacity: 0.35;
      pointer-events: none;
      filter: grayscale(80%);
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .player-header h3 {
      font-size: 15px;
      color: #f5f6fa;
    }

    .turn-btn {
      padding: 4px 10px;
      font-size: 12px;
      background: #487eb0;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .turn-btn:hover {
      background: #40739e;
    }

    .hand-container {
      flex: 1;
      display: flex;
      gap: 8px;
      align-items: center;
      overflow-x: auto;
      padding: 6px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      min-height: 100px;
    }

    /* Cards */
    .card {
      width: 60px;
      height: 88px;
      background: #ffffff;
      color: #2f3640;
      border: 2px solid #2f3640;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      flex-shrink: 0;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 8px 12px rgba(0,0,0,0.4);
    }

    .card-deck {
      width: 65px;
      height: 95px;
      background: linear-gradient(135deg, #e1b12c, #e67e22);
      border: 2px solid #f5f6fa;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      user-select: none;
    }

    .card-deck:hover {
      transform: scale(1.04);
    }

    .card-placeholder {
      width: 65px;
      height: 95px;
      border: 2px dashed #718093;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #718093;
      font-size: 11px;
      text-align: center;
    }

    /* Section 4: Center Empty Area */
    .section-4 {
      grid-column: 2;
      grid-row: 1 / span 2;
      background: #2f3640;
      border: 2px dashed #718093;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #718093;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Section 5: Deck & Discard Pile */
    .section-5 {
      grid-column: 3;
      grid-row: 1;
      background: #353b48;
      border: 2px solid #718093;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .deck-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .slot-label {
      font-size: 12px;
      color: #dcdde1;
      font-weight: 600;
    }

    /* Section 6: Non-interactive Dice D6 & Interactive Coin D2 */
    .section-6 {
      grid-column: 3;
      grid-row: 2;
      background: #353b48;
      border: 2px solid #718093;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .component-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* Three.js Canvas Container */
    #dice-canvas-container {
      width: 90px;
      height: 90px;
      pointer-events: none; /* Impossible to interact */
    }

    /* Interactive 3D CSS Coin */
    .coin-wrapper {
      perspective: 1000px;
    }

    .coin {
      width: 75px;
      height: 75px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .coin-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      backface-visibility: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      font-weight: bold;
      color: #1e272e;
      background: radial-gradient(circle, #fbc531 0%, #e1b12c 100%);
      border: 4px solid #f5cd79;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.4), 0 4px 8px rgba(0,0,0,0.3);
    }

    .coin-back {
      transform: rotateY(180deg);
    }
  </style>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Modal setup -->
  <div id="modal-overlay">
    <div class="modal">
      <h2>Select Number of Players</h2>
      <div class="btn-group">
        <button class="btn-player" onclick="initGame(1)">1 Player</button>
        <button class="btn-player" onclick="initGame(2)">2 Players</button>
        <button class="btn-player" onclick="initGame(3)">3 Players</button>
      </div>
    </div>
  </div>

  <!-- Main Game Board -->
  <div class="game-board">
    
    <!-- Left Panel: Sections 1, 2, 3 -->
    <div class="left-panel">
      <!-- Section 1 -->
      <div class="player-slot" id="player-slot-1">
        <div class="player-header">
          <h3>Player 1</h3>
          <button class="turn-btn" onclick="setActivePlayer(1)">Set Turn</button>
        </div>
        <div class="hand-container" id="hand-1"></div>
      </div>

      <!-- Section 2 -->
      <div class="player-slot" id="player-slot-2">
        <div class="player-header">
          <h3>Player 2</h3>
          <button class="turn-btn" onclick="setActivePlayer(2)">Set Turn</button>
        </div>
        <div class="hand-container" id="hand-2"></div>
      </div>

      <!-- Section 3 -->
      <div class="player-slot" id="player-slot-3">
        <div class="player-header">
          <h3>Player 3</h3>
          <button class="turn-btn" onclick="setActivePlayer(3)">Set Turn</button>
        </div>
        <div class="hand-container" id="hand-3"></div>
      </div>
    </div>

    <!-- Section 4: Center Area (Empty) -->
    <div class="section-4">
      <span>SECTION 4 (EMPTY)</span>
    </div>

    <!-- Section 5: Deck & Discard / Played Slot -->
    <div class="section-5">
      <div class="deck-slot">
        <span class="slot-label">Draw Deck</span>
        <div class="card-deck" onclick="drawCard()">DECK</div>
      </div>
      <div class="deck-slot">
        <span class="slot-label">Played Card</span>
        <div id="played-card-slot" class="card-placeholder">Empty</div>
      </div>
    </div>

    <!-- Section 6: Interactive D6 & Interactive Coin D2 -->
    <div class="section-6">
      <div class="component-box">
        <span class="slot-label">D6 Dice (3D)</span>
        <div id="dice-canvas-container"></div>
      </div>
      <div class="component-box">
        <span class="slot-label">D2 Coin (Click)</span>
        <div class="coin-wrapper" onclick="flipCoin()">
          <div class="coin" id="coin">
            <div class="coin-face coin-front">R</div>
            <div class="coin-face coin-back">L</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Game State variables
    let totalPlayers = 3;
    let activePlayer = 1;
    let deck = ["A♠", "K♥", "Q♦", "J♣", "10♠", "9♥", "8♦", "7♣", "6♠", "5♥", "4♦", "3♣", "2♠"];
    let playerHands = { 1: [], 2: [], 3: [] };

    function initGame(num) {
      totalPlayers = num;
      document.getElementById('modal-overlay').style.display = 'none';

      for (let i = 1; i <= 3; i++) {
        const slot = document.getElementById(`player-slot-${i}`);
        if (i > totalPlayers) {
          slot.classList.add('disabled');
        } else {
          slot.classList.remove('disabled');
        }
      }
      setActivePlayer(1);
    }

    function setActivePlayer(num) {
      if (num > totalPlayers) return;
      activePlayer = num;
      for (let i = 1; i <= totalPlayers; i++) {
        const slot = document.getElementById(`player-slot-${i}`);
        if (i === num) {
          slot.classList.add('active-turn');
        } else {
          slot.classList.remove('active-turn');
        }
      }
    }

    function drawCard() {
      if (deck.length === 0) {
        alert("Deck is empty!");
        return;
      }
      const drawnCard = deck.pop();
      playerHands[activePlayer].push(drawnCard);
      renderHand(activePlayer);
    }

    function renderHand(playerNum) {
      const handContainer = document.getElementById(`hand-${playerNum}`);
      handContainer.innerHTML = '';
      playerHands[playerNum].forEach((cardVal, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card';
        cardEl.innerText = cardVal;
        cardEl.onclick = () => playCard(playerNum, index);
        handContainer.appendChild(cardEl);
      });
    }

    function playCard(playerNum, cardIndex) {
      if (playerNum !== activePlayer) {
        setActivePlayer(playerNum);
      }
      const playedCard = playerHands[playerNum].splice(cardIndex, 1)[0];
      renderHand(playerNum);

      // Render into Section 5 Played Slot (Face up)
      const playedSlot = document.getElementById('played-card-slot');
      playedSlot.className = 'card';
      playedSlot.innerText = playedCard;
    }

    // Coin Flip Logic (D2)
    let currentCoinRotation = 0;
    function flipCoin() {
      const coin = document.getElementById('coin');
      const isR = Math.random() < 0.5;
      const extraFlips = (Math.floor(Math.random() * 5) + 5) * 360; 
      const targetAngle = isR ? 0 : 180;
      
      currentCoinRotation += extraFlips + targetAngle - (currentCoinRotation % 360);
      coin.style.transform = `rotateY(${currentCoinRotation}deg)`;
    }
  </script>
  <script src="dice/dice.js"></script>
</body>
</html>
